[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudstream"
version = "0.1.0"
description = "Synthetic real-time financial fraud detection platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "kafka-python-ng>=2.2,<3",
  "joblib>=1.4,<2",
  "numpy>=2,<3",
  "pandas>=2,<3",
  "pydantic>=2.7,<3",
  "prometheus-client>=0.20,<1",
  "psycopg[binary]>=3.2,<4",
  "redis>=5,<6",
  "scikit-learn>=1.5,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
fraudstream-producer = "fraudstream_producer.__main__:main"

[tool.setuptools.packages.find]
where = ["producer", "backend", "ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
